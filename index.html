/* ========================================
   GLOBAL
======================================== */

* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {

    margin: 0;
    min-height: 100vh;

    background:
        radial-gradient(
            circle at top,
            #202020 0%,
            #0a0a0a 40%,
            #000000 100%
        );

    color: white;

    font-family:
        Arial,
        Helvetica,
        sans-serif;
}


/* ========================================
   HEADER
======================================== */

header {

    min-height: 42vh;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    text-align: center;

    padding: 70px 20px;
}


.logo {

    margin: 0;

    font-size:
        clamp(
            70px,
            13vw,
            150px
        );

    line-height: .9;

    letter-spacing:
        clamp(
            10px,
            2vw,
            28px
        );
}


.subtitle {

    margin-top: 30px;

    color:
        rgba(
            255,
            255,
            255,
            .50
        );

    font-size: 11px;

    letter-spacing: 12px;
}


.header-line {

    width: 80px;
    height: 1px;

    margin-top: 30px;

    background:
        rgba(
            255,
            255,
            255,
            .30
        );
}


/* ========================================
   COLLECTION
======================================== */

.collection {

    width:
        min(
            1400px,
            92%
        );

    margin: 0 auto;

    padding-bottom: 120px;
}


.collection-title {

    margin-bottom: 30px;

    color:
        rgba(
            255,
            255,
            255,
            .35
        );

    font-size: 10px;

    letter-spacing: 6px;
}


/* ========================================
   GRID
======================================== */

.grid {

    display: grid;

    grid-template-columns:
        repeat(
            auto-fill,
            minmax(
                220px,
                1fr
            )
        );

    gap: 48px 28px;
}


/* ========================================
   SONG CARD
======================================== */

.song-card {

    display: block;

    min-width: 0;

    color: white;

    text-decoration: none;

    cursor: pointer;
}


.cover-box {

    position: relative;

    width: 100%;

    aspect-ratio: 1 / 1;

    overflow: hidden;

    background: #111;

    box-shadow:
        0 15px 45px
        rgba(
            0,
            0,
            0,
            .65
        );

    transition:
        transform
        .3s ease;
}


.song-card:hover .cover-box {

    transform:
        translateY(
            -7px
        );
}


.cover {

    display: block;

    width: 100%;
    height: 100%;

    object-fit: cover;

    transition:
        transform
        .35s ease,
        opacity
        .35s ease;
}


.song-card:hover .cover {

    transform:
        scale(
            1.04
        );

    opacity: .70;
}


/* ========================================
   PLAY ICON
======================================== */

.play {

    position: absolute;

    top: 50%;
    left: 50%;

    transform:
        translate(
            -50%,
            -50%
        );

    width: 60px;
    height: 60px;

    display: flex;

    align-items: center;
    justify-content: center;

    border-radius: 50%;

    border:
        1px solid
        rgba(
            255,
            255,
            255,
            .70
        );

    background:
        rgba(
            0,
            0,
            0,
            .70
        );

    opacity: 0;

    pointer-events: none;

    transition:
        opacity
        .3s ease;
}


.song-card:hover .play {

    opacity: 1;
}


/* ========================================
   SONG INFO
======================================== */

.number {

    margin-top: 17px;

    color:
        rgba(
            255,
            255,
            255,
            .30
        );

    font-size: 9px;

    letter-spacing: 3px;
}


.song-title {

    margin-top: 7px;

    font-size: 14px;

    font-weight: bold;

    letter-spacing: 2px;
}


.artist {

    margin-top: 7px;

    color:
        rgba(
            255,
            255,
            255,
            .40
        );

    font-size: 9px;

    letter-spacing: 4px;
}


/* ========================================
   FOOTER
======================================== */

footer {

    padding: 50px;

    text-align: center;

    color:
        rgba(
            255,
            255,
            255,
            .20
        );

    font-size: 9px;

    letter-spacing: 5px;
}


/* ========================================
   MOBILE
======================================== */

@media (max-width: 600px) {

    .grid {

        grid-template-columns:
            repeat(
                2,
                1fr
            );

        gap: 35px 14px;
    }

}

</style>
