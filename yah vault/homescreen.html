<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>YAH VAULT</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            background: #050505;
            color: white;

            font-family:
                Arial,
                Helvetica,
                sans-serif;
        }


        /* HEADER */

        header {
            padding: 80px 25px 60px;
            text-align: center;
        }

        .yah {
            margin: 0;

            font-size:
                clamp(55px, 10vw, 110px);

            line-height: 1;

            letter-spacing: 18px;
        }

        .vault-name {
            margin-top: 20px;

            color: #777;

            font-size: 11px;

            letter-spacing: 10px;
        }


        /* VAULT GRID */

        .vault-grid {
            width: min(1400px, 92%);

            margin: 0 auto;

            padding-bottom: 150px;

            display: grid;

            grid-template-columns:
                repeat(
                    auto-fill,
                    minmax(230px, 1fr)
                );

            gap: 45px 30px;
        }


        /* SONG CARD */

        .song-card {
            display: block;

            color: white;

            text-decoration: none;

            cursor: pointer;
        }

        .cover-box {
            position: relative;

            width: 100%;

            aspect-ratio: 1 / 1;

            overflow: hidden;

            background: #111;
        }

        .cover {
            display: block;

            width: 100%;
            height: 100%;

            object-fit: cover;

            transition:
                transform .35s ease,
                opacity .35s ease;
        }

        .song-card:hover .cover {
            transform: scale(1.04);
            opacity: .75;
        }


        /* PLAY ICON */

        .play {
            position: absolute;

            top: 50%;
            left: 50%;

            transform:
                translate(-50%, -50%);

            display: flex;

            align-items: center;
            justify-content: center;

            width: 65px;
            height: 65px;

            border-radius: 50%;

            background:
                rgba(0,0,0,.65);

            border:
                1px solid rgba(255,255,255,.5);

            font-size: 22px;

            opacity: 0;

            transition:
                opacity .3s ease;

            pointer-events: none;
        }

        .song-card:hover .play {
            opacity: 1;
        }


        /* SONG INFO */

        .song-title {
            margin-top: 16px;

            font-size: 14px;

            font-weight: bold;

            letter-spacing: 3px;
        }

        .artist {
            margin-top: 7px;

            color: #777;

            font-size: 10px;

            letter-spacing: 4px;
        }


        /* MOBILE */

        @media (max-width: 600px) {

            header {
                padding:
                    55px 20px 40px;
            }

            .yah {
                letter-spacing: 10px;
            }

            .vault-grid {
                grid-template-columns:
                    repeat(2, 1fr);

                gap:
                    30px 15px;
            }
        }

    </style>

</head>


<body>


    <header>

        <h1 class="yah">
            YAH
        </h1>

        <div class="vault-name">
            THE VAULT
        </div>

    </header>


    <main class="vault-grid">


        <!-- =========================
             1 — FLAT BROKE
        ========================== -->

        <a
            class="song-card"
            href="../1%20Flat%20Broke/Flat%20Broke%20page.html"
        >

            <div class="cover-box">

                <img
                    class="cover"
                    src="../1%20Flat%20Broke/Album%20Cover.png"
                    alt="Flat Broke"
                >

                <div class="play">
                    ▶
                </div>

            </div>


            <div class="song-title">
                FLAT BROKE
            </div>


            <div class="artist">
                YAH
            </div>

        </a>


    </main>


</body>

</html>
