<script>

/* ========================================
   BACKGROUND VIDEO
======================================== */

const backgroundVideo =
    document.getElementById("backgroundVideo");


backgroundVideo.muted = true;
backgroundVideo.loop = true;


/*
Keep attempting to run the background
video without interfering with the music.
*/

function playBackgroundVideo() {

    if (backgroundVideo.paused) {

        backgroundVideo
            .play()
            .catch(() => {});

    }

}


window.addEventListener(
    "load",
    playBackgroundVideo
);


/*
If Chrome blocks autoplay,
the first interaction starts it.
*/

document.addEventListener(
    "click",
    playBackgroundVideo,
    {
        once: true
    }
);


/* ========================================
   MUSIC PLAYERS
======================================== */

const mainAudio =
    document.getElementById("mainAudio");

const masterAudio =
    document.getElementById("masterAudio");


/*
If the regular MP3 starts,
pause only the master WAV.

DO NOT pause the background video.
*/

mainAudio.addEventListener(
    "play",
    function() {

        masterAudio.pause();

        playBackgroundVideo();

    }
);


/*
If the master WAV starts,
pause only the regular MP3.

DO NOT pause the background video.
*/

masterAudio.addEventListener(
    "play",
    function() {

        mainAudio.pause();

        playBackgroundVideo();

    }
);


/* ========================================
   KEEP BACKGROUND LOOPING
======================================== */

backgroundVideo.addEventListener(
    "ended",
    function() {

        backgroundVideo.currentTime = 0;

        playBackgroundVideo();

    }
);

</script>
