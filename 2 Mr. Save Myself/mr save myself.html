<!-- ========================================
     AUDIO CONTROL SCRIPT
======================================== -->

<script>


const audioPlayers =
    document.querySelectorAll("audio");


audioPlayers.forEach(
    function(player) {


        player.addEventListener(
            "play",
            function() {


                audioPlayers.forEach(
                    function(otherPlayer) {


                        if (
                            otherPlayer
                            !==
                            player
                        ) {

                            otherPlayer.pause();

                        }


                    }
                );


            }
        );


    }
);


</script>
