<style>
*{box-sizing:border-box}
body{margin:0;background:#000;color:#fff;font-family:Arial,Helvetica,sans-serif}

h1{font-size:clamp(50px,9vw,95px);letter-spacing:8px;margin:45px 0 10px}
.artist{color:#aaa;letter-spacing:9px;margin-bottom:60px}

<script>
const players=document.querySelectorAll("audio");

players.forEach(player=>{
    player.addEventListener("play",()=>{
        players.forEach(other=>{
            if(other!==player){
                other.pause();
            }
        });
    });
});
</script>
